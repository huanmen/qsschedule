<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>校园地图</title>
<link rel="stylesheet" href="./leaflet.css"><link rel="stylesheet" href="./mobile.css"></head>
<body class="mobile-map">
<header class="map-header">
<div class="map-header-actions"><button id="settings-open" type="button" aria-label="编辑地图" title="编辑地图"></button></div>
<div class="route-search-row start-row"><i class="stop-dot start" aria-hidden="true"></i><input id="campus-search" type="search" placeholder="起点" aria-label="搜索起点" autocomplete="off" enterkeyhint="search"><button id="filter-open" type="button" aria-label="筛选地点" title="筛选地点"></button><button id="route-expand" type="button" aria-label="展开终点" title="展开终点"></button></div>
<div class="route-search-row end-row" hidden><i class="stop-dot end" aria-hidden="true"></i><input id="route-end-search" type="search" placeholder="终点" aria-label="搜索终点" autocomplete="off" enterkeyhint="search"><button id="route-swap" type="button" aria-label="交换起终点" title="交换起终点"></button><button id="route-go" type="button" aria-label="开始导航" title="开始导航"></button></div>
</header>
<div id="campus-results" class="search-results" hidden></div><p id="app-status" role="status" aria-live="polite"></p>
<main id="map" aria-label="校园地图"></main>
<div class="map-actions"><button id="app-locate" type="button">定位</button><button id="fit-campus" type="button">全览</button></div>
<div id="center-preview" class="map-pin preview" hidden></div>
<div id="map-details">
<div id="position-bar" hidden><button id="position-confirm" type="button">使用此位置</button><button id="position-cancel" type="button">取消</button></div>
<section id="selected-panel" class="bottom-panel" hidden><div class="panel-title"><span id="selected-name"></span><button id="selected-close" type="button" aria-label="关闭地点">×</button></div><div id="selected-note"></div><div class="actions"><button id="set-start" type="button">设为起点</button><button id="set-end" type="button">导航到这里</button><button id="edit-selected" type="button">编辑</button><button id="pick-selected" type="button" hidden>关联此地点</button></div></section>
<section id="route-panel" class="route-panel" hidden><div class="route-summary"><div><span id="route-status" role="status"></span><p id="route-note" hidden>校内步行 · 预计用时</p></div><button id="campus-clear-route" type="button" aria-label="结束导航" title="结束导航">×</button></div><div class="actions"><button id="app-external" type="button">地图软件导航</button><button id="fit-route" type="button">全览路线</button></div></section>
</div>
<dialog id="filters"><form method="dialog"><div class="panel-title"><span>显示地点</span><button aria-label="关闭筛选">×</button></div></form><div id="filter-tags" class="tag-options"></div><label class="choice"><input id="show-schedule" type="checkbox" checked>课程与活动地点</label><div class="actions"><button id="filter-defaults" type="button">恢复默认</button><button id="save-defaults" type="button">保存为默认</button></div></dialog>
<dialog id="editor"><div class="panel-title"><span>编辑地点</span><button id="cancel-edit" type="button" aria-label="取消编辑">×</button></div><label for="edit-name">名称</label><input id="edit-name" maxlength="80"><button id="move-place" type="button">调整位置</button><label>标签</label><div id="edit-tags" class="tag-options"></div><label for="default-visible">默认显示</label><select id="default-visible"><option value="inherit">跟随标签</option><option value="show">显示</option><option value="hide">隐藏</option></select><div class="actions"><button id="save-place" type="button">保存修改</button><button id="delete-place" type="button">删除地点</button></div><div id="delete-confirm" hidden><p>删除这个地点？</p><button id="confirm-delete" type="button">确认删除</button><button id="cancel-delete" type="button">取消</button></div></dialog>
<dialog id="settings"><form method="dialog"><div class="panel-title"><span>地图编辑设置</span><button aria-label="关闭设置">×</button></div></form><div class="settings-list"><button id="start-edit" type="button">新增地点</button><button id="manage-tags" type="button">管理标签</button><button id="manage-defaults" type="button">默认显示设置</button><button id="undo-delete" type="button" disabled>撤销删除地点</button><button id="import-edits" type="button">导入编辑数据</button><button id="export-edits" type="button">导出编辑数据</button></div></dialog>
<dialog id="tag-manager"><form method="dialog"><div class="panel-title"><span>标签管理</span><button aria-label="关闭标签管理">×</button></div></form><div class="actions"><input id="tag-name" maxlength="40" placeholder="新标签名称" aria-label="新标签名称"><button id="add-tag" type="button">添加</button></div><div id="tag-list"></div></dialog>
<script src="./leaflet.js"></script><script src="./vendor/leaflet-rotate/leaflet-rotate.js"></script><script src="./data/tile-manifest-cropped.js"></script><script src="./data/tile-config.js"></script><script src="./data/mobile-catalog.js"></script><script src="./data/task-annotations.js"></script><script src="./data/campus-layout.js"></script><script src="./data/place-store.js"></script><script src="./data/initial-edits.js"></script><script src="./data/campus-layer.js"></script><script src="./vendor/package/dijkstra.js"></script><script src="./data/road-router.js"></script><script src="./mobile.js"></script>
</body></html>
