<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>插件管理 · 泉师课表</title><link rel="stylesheet" href="/admin.css"><script defer src="/admin.js"></script></head>
<body>
<header><div><p class="eyebrow">泉师课表 · 管理工具</p><h1>插件管理</h1></div><div class="header-actions"><button id="reload">刷新</button><button id="preview">市场预览</button><button id="new" class="primary">＋ 添加插件</button></div></header>
<p class="environment" id="environment">正在连接管理服务…</p>
<div id="notice" role="status" aria-live="polite"></div>
<main><aside><div class="catalog-heading"><h2>插件目录</h2><span id="count"></span></div><input id="search" type="search" aria-label="搜索插件" placeholder="搜索名称或 ID"><nav id="filters" aria-label="筛选状态"><button data-status="all" aria-pressed="true">全部</button><button data-status="published">已发布</button><button data-status="draft">草稿</button><button data-status="unpublished">已下架</button></nav><div id="plugins"></div></aside>
<section id="workspace"><div id="empty"><h2>选择一个插件开始管理</h2><p>编辑资料、准备新版本，再发布到市场。</p></div><div id="editor" hidden>
<div class="editor-heading"><div><p id="plugin-id" class="mono"></p><h2 id="plugin-title"></h2><p id="published-info" class="muted"></p></div><span id="state-badge" class="badge"></span></div>
<nav id="tabs" aria-label="编辑内容"><button data-tab="metadata" aria-pressed="true">基本信息</button><button data-tab="content">规则与资料</button><button data-tab="history">版本记录</button></nav>
<section id="metadata" class="tab-panel"><form id="metadata-form"><div class="form-grid">
<label>插件名称<input name="name" required maxlength="40"></label><label>插件 ID<input name="id" required pattern="[a-z][a-z0-9.\-]{2,63}" placeholder="org.example.rules"><small>保存后固定，作为安装与更新标识。</small></label>
<label class="full">简介<input name="summary" required maxlength="80"></label>
<label>交付类型<select name="kind"><option value="adskip-rule-pack">广告规则数据包</option><option value="academic-records">赛事与考证资料</option><option value="builtin">已接入的原生插件</option></select></label>
<label>插件版本号<div class="inline"><input name="version" type="number" min="1" max="2147483647" required><button id="next-version" type="button">准备新版本</button></div></label>
<label>最低 App 版本号<input name="minAppVersion" type="number" min="1" required></label><label>最低规则适配器版本<input name="minAdapterVersion" type="number" min="1" max="3" required></label>
<label class="full">公开规则网址（也可直接上传 JSON）<input name="rulesUrl" type="url" placeholder="https://example.org/rules.json"><small>上传资料包后优先使用上传内容。外部网址的规则仍由 App 检查兼容性。</small></label>
<label class="full">更新说明<textarea name="notes" rows="3" maxlength="2000" placeholder="这个版本修改了什么"></textarea></label></div></form>
<div class="package-strip"><div><strong>资料包</strong><p id="package-info" class="muted">尚未上传</p></div><div class="inline"><button id="upload">导入 JSON</button><button id="export">导出 JSON</button><button id="clear-package">移除草稿资料包</button></div></div><p id="kind-help" class="help"></p>
</section>
<section id="content" class="tab-panel" hidden><div class="content-tools"><div><h3>规则与资料</h3><p class="muted">可逐字段编辑，也可以修改完整 JSON。保存草稿不会改变已发布版本。</p></div><button id="raw-toggle">完整 JSON</button></div>
<div id="structured"><div class="records-tools"><input id="record-search" type="search" aria-label="搜索资料条目" placeholder="搜索赛事、规则或内容"><button id="add-record">添加条目</button><button id="package-settings">资料包其他字段</button></div><div class="content-grid"><div><div id="record-list"></div><button id="more-records" hidden>显示更多</button></div><div id="record-editor"></div></div></div>
<div id="raw-wrap" hidden><label for="raw">完整资料包 JSON</label><textarea id="raw" class="code" rows="24" spellcheck="false"></textarea><div class="inline"><button id="apply-raw">应用 JSON 修改</button><button id="format-raw">格式化</button></div><p class="muted">应用后可回到逐字段视图继续编辑；发布前会检查格式、版本和条目标识。</p></div></section>
<section id="history" class="tab-panel" hidden><p class="help">恢复会生成待保存的草稿。若修改已发布资料，使用更高版本号重新发布。</p><div id="history-list"></div></section>
<footer><span id="dirty-state">尚未修改</span><div class="inline"><button id="unpublish" class="danger">下架</button><button id="save">保存草稿</button><button id="publish" class="primary">发布</button></div></footer>
</div></section></main>
<input id="file" type="file" accept="application/json,.json" hidden>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-ok" value="confirm" class="primary">确认</button></div></form></dialog>
<dialog id="fragment-dialog"><form id="fragment-form"><h2 id="fragment-title">编辑 JSON</h2><label for="fragment">JSON 内容</label><textarea id="fragment" class="code" rows="15" required spellcheck="false"></textarea><p id="fragment-error" role="alert"></p><div class="dialog-actions"><button type="button" id="fragment-cancel">取消</button><button class="primary">应用修改</button></div></form></dialog>
<dialog id="preview-dialog"><h2>市场预览</h2><p class="muted">这里仅显示当前已发布版本，草稿和下架插件不会展示。</p><div id="preview-list"></div><button id="preview-close">关闭</button></dialog>
</body></html>
